name: Build and deploy JAR app to Azure Web App - employeadithya

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven
        working-directory: springboot-backend
        run: mvn clean package -DskipTests

      - name: Verify JAR
        run: ls -la springboot-backend/target

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: springboot-backend/target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: downloaded

      - name: Verify Download
        run: ls -la downloaded

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5E00FEDBB5784DB4A19748FA8E4F4779 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1621E70A470B4209B91230510153511B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C60C47D0D903413E99F3AD0AEEFC162F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: employeadithya
          slot-name: Production
          package: downloaded/*.jar
